server:
  port: 8080

spring:
  docker:
    compose:
      profiles:
        active: sit
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:sit-db}
    username: ${DB_USER:sit-user}
    password: ${DB_PASSWORD:sit-user}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.tariqul.dev: DEBUG
    org.hibernate.SQL: DEBUG
